<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>API 設定</title>
  <style>
    body { font-size: 1.5em; padding: 30px; background: #f8fafc; }
    label { font-weight: bold; }
    input { width: 400px; font-size: 1em; }
    button { font-size: 1em; padding: 0.5em 1.5em; }
  </style>
</head>
<body>
  <h2>API 主機設定</h2>
  <label>API 主機網址：</label>
  <input type="text" id="apiHost" />
  <button id="saveBtn">儲存</button>
  <span id="msg" style="color:green; margin-left:2em;"></span>
  <script>
    // 讀取目前設定
    window.onload = function() {
      const cfg = window.configAPI.load();
      document.getElementById('apiHost').value = cfg.api_host;
    };
    // 存檔
    document.getElementById('saveBtn').onclick = function() {
      const api_host = document.getElementById('apiHost').value;
      window.configAPI.save({ api_host });
      document.getElementById('msg').innerText = "儲存成功！";
    };
  </script>
</body>
</html>
