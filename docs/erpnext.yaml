version: '3'

services:
  backend:
    image: frappe/erpnext:v14.26.0
    container_name: erpnext-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mariadb
      - redis
    environment:
      DB_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: erp_db_pass123
      ADMIN_PASSWORD: admin123
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    command: tail -f /dev/null

  mariadb:
    image: mariadb:10.6
    container_name: erpnext-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: erp_db_pass123
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: erpnext-redis
    restart: always

volumes:
  mariadb_data:
  sites:
  logs: